<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas 3D do Corpo Humano</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <button id="menu-toggle" type="button" aria-controls="controls" aria-expanded="false" aria-label="Abrir menu de filtros">☰</button>
    <h1>Atlas 3D do Corpo Humano</h1>
    <p>Material educativo. Não substitui orientação médica.</p>
    <a id="open-exercise" class="header-link" href="#agachamento">Exercícios</a>
    <button id="open-credits" type="button">Créditos e licenças</button>
  </header>
  <main>
    <div id="menu-backdrop"></div>
    <aside id="controls" aria-label="Filtros">
      <button id="menu-close" type="button">Fechar ✕</button>
      <div class="search">
        <input id="search" type="search" placeholder="Buscar estrutura…" aria-label="Buscar estrutura" autocomplete="off">
        <ul id="results"></ul>
      </div>
      <h2>Camadas</h2>
      <ul id="layers"></ul>
      <button id="reset" type="button">Mostrar tudo e centralizar</button>
      <p class="hint">Arraste para girar, use a rolagem para aproximar e o botão direito para mover.</p>
    </aside>
    <div id="viewer"></div>
    <aside id="details" aria-live="polite"></aside>
  </main>
  <div id="exercise" hidden></div>
  <dialog id="credits"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
